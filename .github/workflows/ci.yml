name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# BELAY_DESIGN.md §9.1 test matrix. All jobs gate every PR and every push to
# main, and every platform runs the full `make check`. The Linux-only session
# tree is excluded off Linux by uname -s in the Makefile; main.c's session
# calls are behind #ifdef __linux__.
jobs:
  build-linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: uname -m
      - name: platform summary
        run: make platform
      - name: build + test
        run: make check

  build-linux-arm64:
    name: linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: uname -m
      - name: platform summary
        run: make platform
      - name: build + test
        run: make check

  test-macos:
    name: macos-portable
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - run: uname -m
      - name: platform summary
        run: make platform
      # §9.1: macOS gates the portable engine (capture/A, diff/, interp/).
      # The Linux-only session tree is excluded by uname -s, and main.c's
      # session calls sit behind #ifdef __linux__, so the full `make check`
      # builds, links and tests here.
      - name: build + test
        run: make check

  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    # §0.4c: ASan + UBSan gate every PR. Fuzz targets for the path utilities
    # and the manifest reader are added by the phases that create them
    # (M1 phase 0.3 and phase 2.3); test/fuzz/ exists for them to land in.
    steps:
      - uses: actions/checkout@v5
      - run: uname -m
      - name: platform summary
        run: make platform
      - name: asan + ubsan
        run: make check-san

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    # §0.4c: fuzz targets for the path utilities and (from phase 2.3) the
    # manifest reader -- the two places untrusted input meets parsing.
    # Short runs gate PRs; they are regression checks, not a fuzzing campaign.
    steps:
      - uses: actions/checkout@v5
      - name: fuzz (clang/libFuzzer)
        run: make fuzz CC=clang FUZZ_SECS=30

  dco:
    name: dco
    runs-on: ubuntu-24.04
    # §4.5: Apache-2.0 + DCO sign-off, enforced from 2026-10-20 forward.
    # Comparing base..head means pre-cutoff commits are never examined, so the
    # no-backfill decision is structural rather than a hardcoded date.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: check Signed-off-by on new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-dco.sh "$BASE" "$HEAD"
