name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# BELAY_DESIGN.md §9.1 test matrix. Every job here is a required check of
# main's branch protection (test/accounting/required-checks.txt), every platform
# runs the full `make check`, and scripts/check-ci.py fails the build if a job
# or step could go red without failing (continue-on-error, if:, || true).
#
# BELAY_SKIP_PROFILE names the job's declared skips, test/accounting/skips/
# <job>.txt: a test that skips without being declared there, or is declared
# and runs, fails the job (test/belay_test.h). The Ubuntu jobs enable
# unprivileged user namespaces (Ubuntu 24.04 restricts them through AppArmor),
# so the mount, overlay and file-capability tests run instead of skipping.
#
# The Linux-only session tree is excluded off Linux by uname -s in the
# Makefile; main.c's session calls are behind #ifdef __linux__.
jobs:
  build-linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    env:
      BELAY_SKIP_PROFILE: linux-x86_64
    steps:
      - uses: actions/checkout@v5
      - run: uname -m
      - name: platform summary
        run: make platform
      - name: enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: build + test
        run: make check
      - name: diff oracle (belay_diff against a naive reference)
        run: make oracle

  build-linux-arm64:
    name: linux-arm64
    runs-on: ubuntu-24.04-arm
    env:
      BELAY_SKIP_PROFILE: linux-arm64
    steps:
      - uses: actions/checkout@v5
      - run: uname -m
      - name: platform summary
        run: make platform
      - name: enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: build + test
        run: make check

  test-macos:
    name: macos-portable
    # macos-14 is retired on 2026-11-02 and failed in GitHub's scheduled
    # brownouts before that (actions/runner-images#13518).
    runs-on: macos-15
    env:
      BELAY_SKIP_PROFILE: macos-portable
    steps:
      - uses: actions/checkout@v5
      - run: uname -m
      - name: platform summary
        run: make platform
      # §9.1: macOS gates the portable engine (capture/A, diff/, interp/).
      # The Linux-only session tree is excluded by uname -s, and main.c's
      # session calls sit behind #ifdef __linux__, so the full `make check`
      # builds, links and tests here.
      - name: build + test
        run: make check

  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    env:
      BELAY_SKIP_PROFILE: asan-ubsan
    # §0.4c: ASan + UBSan gate every PR.
    steps:
      - uses: actions/checkout@v5
      - run: uname -m
      - name: platform summary
        run: make platform
      - name: enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: asan + ubsan
        run: make check-san

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    # §0.4c: fuzz targets for the path utilities and the manifest reader --
    # the two places untrusted input meets parsing. Short runs gate PRs.
    steps:
      - uses: actions/checkout@v5
      - name: fuzz (clang/libFuzzer)
        run: make fuzz CC=clang FUZZ_SECS=30

  dco:
    name: dco
    runs-on: ubuntu-24.04
    # §4.5: Apache-2.0 + DCO sign-off, enforced from 2026-10-20 forward.
    # Comparing base..head means pre-cutoff commits are never examined, so the
    # no-backfill decision is structural rather than a hardcoded date. On a
    # pull request the range is the PR's commits; on a push to main, the
    # pushed commits. Merge commits are not checked (scripts/check-dco.sh).
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: check Signed-off-by on new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/check-dco.sh "$BASE" "$HEAD"

  docker:
    name: docker
    runs-on: ubuntu-24.04
    # M1 done-criterion, gap (a): the portable engine inside a container, and
    # /usr-in-Docker timing. The image's /usr sits on overlayfs, so this also
    # exercises the overlay mount rules. Tests run as a non-root user: as root,
    # permission tests (unreadable directories) cannot fail the way they must.
    # The container's seccomp profile denies user namespaces, so its declared
    # skips are the namespace tests (test/accounting/skips/docker.txt).
    steps:
      - uses: actions/checkout@v5
      - name: build + test + /usr timing inside ubuntu:24.04
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends build-essential python3 >/dev/null
            useradd -m tester
            cp -r /src /home/tester/w && chown -R tester /home/tester/w
            su tester -c "cd /home/tester/w && BELAY_SKIP_PROFILE=docker make check && make bench"
            cd /home/tester/w
            for run in first warm warm; do
              su tester -c "./build/bench/bench_check /usr usr-in-docker-$run" | tail -1
            done'

  filesystems:
    name: filesystems
    runs-on: ubuntu-24.04
    # Gap (b): every HIGH review finding was about a change during the walk on
    # filesystems other than local ext4 -- NFS, coarse timestamps, btrfs
    # subvolumes. Loopback btrfs and FAT images and a loopback NFS export,
    # with test/fs/fs_scenarios.c on each, and the stress test on btrfs and
    # NFS (under the harness's accounting). On FAT the "fresh fixture" cases
    # are known issue R4-F1: XFAIL only when the capture itself worked and the
    # change escaped; anything else, an unexpected catch included, fails.
    env:
      BELAY_ACCOUNTING: test/accounting
      BELAY_SKIP_PROFILE: filesystems
    steps:
      - uses: actions/checkout@v5
      - name: install filesystem tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs dosfstools nfs-kernel-server >/dev/null
      - name: build
        run: make fs-scenarios build/test/test_stress
      - name: btrfs (loopback, with a subvolume inside the scope)
        run: |
          truncate -s 512M /tmp/btrfs.img && mkfs.btrfs -q /tmp/btrfs.img
          sudo mkdir -p /mnt/btrfs && sudo mount -o loop /tmp/btrfs.img /mnt/btrfs
          sudo btrfs subvolume create /mnt/btrfs/sv
          sudo chown -R "$(id -u):$(id -g)" /mnt/btrfs
          ./build/fs_scenarios /mnt/btrfs --subvol sv
          BELAY_TEST_ROOT=/mnt/btrfs ./build/test/test_stress
      - name: FAT (loopback, 2 s timestamps)
        run: |
          truncate -s 256M /tmp/fat.img && mkfs.vfat -F 32 /tmp/fat.img >/dev/null
          sudo mkdir -p /mnt/fat
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)" /tmp/fat.img /mnt/fat
          ./build/fs_scenarios /mnt/fat --coarse
      - name: NFS (loopback export)
        run: |
          sudo mkdir -p /srv/nfs && sudo chown "$(id -u):$(id -g)" /srv/nfs
          echo "/srv/nfs 127.0.0.1(rw,sync,no_subtree_check,insecure)" | sudo tee /etc/exports
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -ra
          sudo mkdir -p /mnt/nfs && sudo mount -t nfs -o vers=4.2 127.0.0.1:/srv/nfs /mnt/nfs
          ./build/fs_scenarios /mnt/nfs
          BELAY_TEST_ROOT=/mnt/nfs ./build/test/test_stress
