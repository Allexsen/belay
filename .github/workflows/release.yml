name: release

# A pre-release from a version tag (v*): the binaries built from the tagged
# commit, each run end to end before it is attached, their SHA256SUMS, build
# provenance, and the notes in docs/releases/<tag>.md. The release is created
# as a DRAFT: it is published by hand after its assets are downloaded,
# verified against SHA256SUMS and run. A tag is pushed only once main is green
# at that commit, so the full test matrix (ci.yml) has already run there; this
# workflow builds the shipped binaries and tests those.
#
# Linux binaries are static (glibc, -static: no NSS or dlopen calls, so
# nothing resolves at run time). macOS has no static linking; its binary links
# only libSystem.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x86_64, os: ubuntu-24.04, cflags: '-O2 -static' }
          - { target: linux-arm64, os: ubuntu-24.04-arm, cflags: '-O2 -static' }
          - { target: macos-arm64, os: macos-15, cflags: '-O2' }
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - name: the tag is the version the binary reports
        run: |
          make CFLAGS='${{ matrix.cflags }}' bin/belay
          want="belay ${GITHUB_REF_NAME#v} "
          got=$(bin/belay --version)
          case "$got" in "$want"*) echo "$got" ;; *) echo "tag $GITHUB_REF_NAME, binary says: $got" >&2; exit 1 ;; esac
      - name: the shipped binary, end to end
        run: sh scripts/e2e.sh bin/belay
      - name: package
        run: |
          strip bin/belay
          mkdir dist
          cp bin/belay "dist/belay-${GITHUB_REF_NAME}-${{ matrix.target }}"
          file "dist/belay-${GITHUB_REF_NAME}-${{ matrix.target }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: belay-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: draft pre-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum belay-* > SHA256SUMS
          cat SHA256SUMS
      - name: create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          gh release create "$GITHUB_REF_NAME" dist/* --draft --prerelease --verify-tag \
            --title "belay ${GITHUB_REF_NAME} (pre-alpha)" --notes-file "$notes"

  # pybelay (test/expect/pybelay.md, PY-D3/PY-D4): a wheel per target, each
  # carrying that target's binary of this release, taken from the release's
  # assets after their SHA256SUMS and provenance attestations are checked. The
  # key sets come from the linux-x86_64 binary (the formats are the release's,
  # whatever the platform). Attached to the draft; never published to PyPI by
  # this workflow (a release needs the author's OK).
  wheels:
    name: pybelay wheels
    needs: draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: the binaries are the release's (SHA256SUMS, provenance)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -D released
          (cd dist && sha256sum belay-*) | sort > got
          sort released/SHA256SUMS > want
          diff want got
          for f in dist/belay-*; do gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; done
      - name: build the wheels
        run: |
          python3 -m pip install -q build wheel
          chmod +x dist/belay-*
          keys="dist/belay-${GITHUB_REF_NAME}-linux-x86_64"
          for t in linux-x86_64:manylinux_2_17_x86_64.musllinux_1_1_x86_64 \
                   linux-arm64:manylinux_2_17_aarch64.musllinux_1_1_aarch64 \
                   macos-arm64:macosx_15_0_arm64; do
            # Each wheel carries the Linux binaries it doesn't vendor, for sandboxes (PY-D4).
            python3 python/build_keys.py "$keys" "dist/belay-${GITHUB_REF_NAME}-${t%%:*}" \
              "dist/belay-${GITHUB_REF_NAME}-linux-x86_64" "dist/belay-${GITHUB_REF_NAME}-linux-arm64"
            rm -rf python/build python/*.egg-info
            python3 -m build --wheel --outdir "wheels-${t%%:*}" python
            python3 -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag "${t#*:}" "wheels-${t%%:*}"/*.whl
          done
          mkdir wheels && mv wheels-*/*.whl wheels/
          (cd wheels && sha256sum *.whl > WHEELS-SHA256SUMS && cat WHEELS-SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: wheels/*.whl
      - name: attach the wheels to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" wheels/*
