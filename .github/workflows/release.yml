name: release

# A pre-release from a version tag (v*): the binaries built from the tagged
# commit, each run end to end before it is attached, their SHA256SUMS, build
# provenance, and the notes in docs/releases/<tag>.md. The release is created
# as a DRAFT: it is published by hand after its assets are downloaded,
# verified against SHA256SUMS and run. A tag is pushed only once main is green
# at that commit, so the full test matrix (ci.yml) has already run there; this
# workflow builds the shipped binaries and tests those.
#
# pybelay reaches PyPI from here too, and only from a published release: when
# the draft is published by hand, `pypi` takes the release's wheels as they
# are, checks them again and uploads them through PyPI's trusted publishing
# (no token is stored). It runs in the `pypi` environment, whose required
# reviewer approves every upload. `testpypi` is the same upload to
# test.pypi.org of a release named by hand (Run workflow), for trials.
#
# Linux binaries are static (glibc, -static: no NSS or dlopen calls, so
# nothing resolves at run time). macOS has no static linking; its binary links
# only libSystem.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'A published release whose wheels go to test.pypi.org'
        required: true

permissions:
  contents: read

# The oldest macOS the macOS binary starts on: the Makefile builds with it as
# MACOSX_DEPLOYMENT_TARGET, the build checks the binary's minos is it, and the
# wheel that vendors the binary is tagged for it. The plugin's pin says it as
# `macos-min`.
env:
  MACOS_MIN: '11.0'

jobs:
  build:
    name: build ${{ matrix.target }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x86_64, os: ubuntu-24.04, cflags: '-O2 -static' }
          - { target: linux-arm64, os: ubuntu-24.04-arm, cflags: '-O2 -static' }
          - { target: macos-arm64, os: macos-15, cflags: '-O2' }
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - name: the tag is the version the binary reports
        run: |
          make CFLAGS='${{ matrix.cflags }}' bin/belay
          want="belay ${GITHUB_REF_NAME#v} "
          got=$(bin/belay --version)
          case "$got" in "$want"*) echo "$got" ;; *) echo "tag $GITHUB_REF_NAME, binary says: $got" >&2; exit 1 ;; esac
      - name: the shipped binary, end to end
        run: sh scripts/e2e.sh bin/belay
      - name: package
        run: |
          strip bin/belay
          mkdir dist
          cp bin/belay "dist/belay-${GITHUB_REF_NAME}-${{ matrix.target }}"
          file "dist/belay-${GITHUB_REF_NAME}-${{ matrix.target }}"
      - name: the macOS binary starts on macOS ${{ env.MACOS_MIN }} (its minos)
        if: runner.os == 'macOS'
        run: |
          f="dist/belay-${GITHUB_REF_NAME}-${{ matrix.target }}"
          otool -l "$f" | grep -A4 LC_BUILD_VERSION
          got=$(otool -l "$f" | awk '$2 == "LC_BUILD_VERSION" { b = 1 } b && $1 == "minos" { print $2; exit }')
          [ "$got" = "$MACOS_MIN" ] || { echo "$f has minos ${got:-none}, not $MACOS_MIN" >&2; exit 1; }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: belay-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: draft pre-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum belay-* > SHA256SUMS
          cat SHA256SUMS
      - name: create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          gh release create "$GITHUB_REF_NAME" dist/* --draft --prerelease --verify-tag \
            --title "belay ${GITHUB_REF_NAME} (pre-alpha)" --notes-file "$notes"

  # pybelay (test/expect/pybelay.md, PY-D3/PY-D4): a wheel per target, each
  # carrying that target's binary of this release, taken from the release's
  # assets after their SHA256SUMS and provenance attestations are checked. The
  # key sets come from the linux-x86_64 binary (the formats are the release's,
  # whatever the platform). Attached to the draft; `pypi` below uploads them
  # once the release is published.
  wheels:
    name: pybelay wheels
    needs: draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: the binaries are the release's (SHA256SUMS, provenance)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -D released
          (cd dist && sha256sum belay-*) | sort > got
          sort released/SHA256SUMS > want
          diff want got
          for f in dist/belay-*; do gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; done
      - name: the macOS wheel's tag is its binary's minos
        run: |
          minos=$(python3 -I -c 'import struct, sys
          d = open(sys.argv[1], "rb").read(); o = 32
          for _ in range(struct.unpack_from("<I", d, 16)[0]):
              c, n = struct.unpack_from("<II", d, o)
              if c == 0x32: v = struct.unpack_from("<I", d, o + 12)[0]; print(f"{v >> 16}.{(v >> 8) & 255}"); break
              o += n' "dist/belay-${GITHUB_REF_NAME}-macos-arm64")
          [ "$minos" = "$MACOS_MIN" ] || { echo "the macOS binary's minos is ${minos:-none}, not $MACOS_MIN" >&2; exit 1; }
          echo "MACOS_TAG=macosx_$(printf %s "$minos" | tr . _)_arm64" >> "$GITHUB_ENV"
      - name: build the wheels
        run: |
          python3 -m pip install -q build wheel
          chmod +x dist/belay-*
          keys="dist/belay-${GITHUB_REF_NAME}-linux-x86_64"
          for t in linux-x86_64:manylinux_2_17_x86_64.musllinux_1_1_x86_64 \
                   linux-arm64:manylinux_2_17_aarch64.musllinux_1_1_aarch64 \
                   "macos-arm64:$MACOS_TAG"; do
            # Each wheel carries the Linux binaries it doesn't vendor, for sandboxes (PY-D4).
            python3 python/build_keys.py "$keys" "dist/belay-${GITHUB_REF_NAME}-${t%%:*}" \
              "dist/belay-${GITHUB_REF_NAME}-linux-x86_64" "dist/belay-${GITHUB_REF_NAME}-linux-arm64"
            rm -rf python/build python/*.egg-info
            python3 -m build --wheel --outdir "wheels-${t%%:*}" python
            python3 -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag "${t#*:}" "wheels-${t%%:*}"/*.whl
          done
          mkdir wheels && mv wheels-*/*.whl wheels/
          ls wheels/*-py3-none-"$MACOS_TAG".whl
          (cd wheels && sha256sum *.whl > WHEELS-SHA256SUMS && cat WHEELS-SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: wheels/*.whl
      - name: attach the wheels to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" wheels/*

  # The wheels of a published release, to PyPI. Nothing is built here: the
  # files are the release's, checked against WHEELS-SHA256SUMS and their
  # provenance before they leave. An upload cannot be replaced, so this waits
  # for the `pypi` environment's reviewer.
  pypi:
    name: pybelay to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pybelay/
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - name: the release's wheels (WHEELS-SHA256SUMS, provenance)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p '*.whl' -p WHEELS-SHA256SUMS -D wheels
          (cd wheels && sha256sum -c WHEELS-SHA256SUMS && test "$(ls *.whl | wc -l)" = "$(wc -l < WHEELS-SHA256SUMS)")
          for f in wheels/*.whl; do gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; done
          rm wheels/WHEELS-SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels

  # The same, to test.pypi.org, for a release named by hand.
  testpypi:
    name: pybelay to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pybelay/
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - name: the release's wheels (WHEELS-SHA256SUMS, provenance)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p '*.whl' -p WHEELS-SHA256SUMS -D wheels
          (cd wheels && sha256sum -c WHEELS-SHA256SUMS && test "$(ls *.whl | wc -l)" = "$(wc -l < WHEELS-SHA256SUMS)")
          for f in wheels/*.whl; do gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; done
          rm wheels/WHEELS-SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          repository-url: https://test.pypi.org/legacy/
